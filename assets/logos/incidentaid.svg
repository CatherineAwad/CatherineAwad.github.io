<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  <!-- Shield Badge Outline with Gradient Stroke -->
  <path d="M 50 12 C 68 12 84 18 84 18 V 46 C 84 66 68 82 50 88 C 32 82 16 66 16 46 V 18 C 16 18 32 12 50 12 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Subtle Shield Fill Tint -->
  <path d="M 50 12 C 68 12 84 18 84 18 V 46 C 84 66 68 82 50 88 C 32 82 16 66 16 46 V 18 C 16 18 32 12 50 12 Z" 
        fill="url(#shieldGrad)" fill-opacity="0.12" />

  <!-- Concentric Emergency Beacon Waves -->
  <g fill="none" stroke="url(#shieldGrad)" stroke-linecap="round">
    <!-- Top Outer Wave -->
    <path d="M 30 36 A 24 24 0 0 1 70 36" stroke-width="6" />
    <!-- Middle Wave -->
    <path d="M 37 46 A 16 16 0 0 1 63 46" stroke-width="6" />
    <!-- Inner Wave -->
    <path d="M 44 56 A 8 8 0 0 1 56 56" stroke-width="6" />
    <!-- Center Point -->
    <circle cx="50" cy="66" r="4" fill="url(#shieldGrad)" />
  </g>
</svg>

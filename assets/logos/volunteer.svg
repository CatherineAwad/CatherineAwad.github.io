<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Volunteer Service App Ornamental Circular Emblem -->
  <g fill="none" stroke="#d97706" stroke-linecap="round" stroke-linejoin="round">
    <!-- Double Circular Border -->
    <circle cx="50" cy="50" r="42" stroke-width="4" fill="#d97706" fill-opacity="0.1" />
    <circle cx="50" cy="50" r="37" stroke-width="2" stroke-dasharray="4 3" />
    
    <!-- Central Heart in Helping Hands -->
    <path d="M 50 66 C 50 66 30 52 30 38 C 30 30 36 24 43 24 C 47 24 50 26.5 50 26.5 C 50 26.5 53 24 57 24 C 64 24 70 30 70 38 C 70 52 50 66 50 66 Z" 
          fill="#d97706" fill-opacity="0.25" stroke-width="3.5" />
          
    <!-- Decorative Corner Dots -->
    <circle cx="50" cy="14" r="2.5" fill="#d97706" />
    <circle cx="50" cy="86" r="2.5" fill="#d97706" />
    <circle cx="14" cy="50" r="2.5" fill="#d97706" />
    <circle cx="86" cy="50" r="2.5" fill="#d97706" />
  </g>
</svg>
